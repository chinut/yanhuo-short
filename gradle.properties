# ===== AndroidX =====
android.useAndroidX=true
android.enableJetifier=false

# AGP 9.x：允许 KSP/kotlin sourceSets 注册生成目录
android.disallowKotlinSourceSets=false

# ===== JVM 内存 =====
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ===== Kotlin =====
kotlin.code.style=official

# ===== Gradle 工具链 =====
# 沿用 Android Studio 自带 JBR，避免去 foojay 下载 JDK
org.gradle.java.installations.paths=E\:\\Program Files\\Android\\Android Studio\\jbr,E\:\\Program Files\\Java\\jdk-26.0.2
org.gradle.java.installations.auto-download=false

android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

org.gradle.tooling.parallel=true
